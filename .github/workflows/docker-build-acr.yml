name: Docker Build, Push to ACR, and Deploy to AKS

on:
  push:
    branches: [feature/PDM-5]
  workflow_dispatch:

env:
  REGISTRY: devacr123456.azurecr.io
  IMAGE_NAME: imlocl-central-hub
  RESOURCE_GROUP: dev-rg
  AKS_CLUSTER_NAME: dev-aks
  NAMESPACE: dev

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        run: docker build -t $IMAGE_NAME .

      - name: Tag image
        run: docker tag $IMAGE_NAME $REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Push image
        run: docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|devacr123456.azurecr.io/imlocl-central-hub:.*|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" kubernetes/deployment.yaml

      - name: Deploy to AKS
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml

      - name: Verify deployment
        run: |
          kubectl get namespaces
          kubectl get nodes
          kubectl get pods -n $NAMESPACE
          kubectl get deployments -n $NAMESPACE
          kubectl get svc -n $NAMESPACE